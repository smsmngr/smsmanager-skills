name: Validate Skills

# Validates the skills catalog and plugin manifests on every push and PR to main.
# There is no registry publish step: the skills CLI (`npx skills add smsmngr/smsmanager-skills`)
# and the Claude Code plugin marketplace both install straight from this public repo, so
# merge to main = published.

on:
  push:
    branches: [main]
    paths:
      - "skills/**"
      - "scripts/**"
      - "tile.json"
      - ".claude-plugin/**"
      - ".github/workflows/publish.yml"
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate catalog (tile.json, plugin manifests, SKILL.md lint)
        run: node scripts/validate.cjs

      - name: Syntax-check bundled scripts
        run: |
          for f in $(find skills -name "*.cjs"); do
            node --check "$f"
          done
